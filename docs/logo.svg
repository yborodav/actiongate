<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="ActionGate" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#07090f"/>
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="13.25" fill="none" stroke="#1f2a3d" stroke-width="1.5"/>
  <g filter="url(#glow)" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- the agent's request: a prompt chevron -->
    <path d="M15 21 L28 32 L15 43" stroke="#3df5ff" stroke-width="5.5"/>
    <!-- the gate it has to pass -->
    <path d="M39 16 V48" stroke="#ff3d8b" stroke-width="5.5"/>
    <!-- what runs once approved -->
    <path d="M49.5 32 H51" stroke="#39ff88" stroke-width="5.5"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
