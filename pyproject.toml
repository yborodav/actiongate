[project]
name = "actiongate"
version = "0.1.0"
description = "Approval-enforcing execution proxy for AI agents"
requires-python = ">=3.11"
dependencies = [
  "starlette>=0.40",
  "uvicorn>=0.30",
  "mcp>=2.0",
  "pyjwt[crypto]>=2.8",
  "cryptography>=42",
  "requests>=2.31",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
actiongate = "actiongate.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["actiongate*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
